<title>Alumnia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..800&display=swap">
<style>
/* Alumnia v2 — prototype. Papier blanc, vert = avancer, jaune = bravo, bleu = l'IA, orange = les pros. */
:root{
  --paper:#FFFFFF; --wash:#F3F6F1; --line:#E3E8E2; --ink:#15201B; --ink-2:#4A5650;
  --green:#1C8247; --green-edge:#14632F; --green-wash:#E3F5E9;
  --sun:#FFC93C; --sun-edge:#E0A800; --sun-wash:#FFF4D1;
  --ai:#1D63B8; --ai-ink:#123E73; --ai-wash:#E6F0FB;
  --human:#B83E0C; --human-dot:#F07A3E; --human-wash:#FFEDE3;
  --partner:#0F766E; --partner-wash:#DFF3F0;
  --danger:#B42318; --control:#8A968F;
  --display:"Bricolage Grotesque","Arial Rounded MT Bold",system-ui,sans-serif;
  --text:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-in-out:cubic-bezier(.77,0,.175,1); --spring:cubic-bezier(.34,1.56,.64,1);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--paper);color:var(--ink)}
body{font:17px/1.5 var(--text);margin:0;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:-.02em;line-height:1.06;margin:0;text-wrap:balance}
.h1{font-size:clamp(32px,4.4vw,40px)}
.h1xl{font-size:clamp(38px,5.4vw,56px)}
.t2{font-size:26px;margin-bottom:10px;letter-spacing:-.015em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
::selection{background:var(--sun);color:var(--ink)}
:focus-visible{outline:3px solid var(--green);outline-offset:3px}
[tabindex="-1"]:focus{outline:none}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 72px}
.muted{color:var(--ink-2)}
.small{font-size:14px}
.lead{font-size:20px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.stack{display:grid;gap:24px;align-content:start;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.g-login{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:40px;align-items:stretch}
.g-road{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,400px);gap:24px}
.g-rdv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:24px}
.g-part{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:24px}
.g-visio{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px}
@media (max-width:1000px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){.grid2,.grid3,.g-login,.g-road,.g-rdv,.g-part,.g-visio{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.grid4{grid-template-columns:minmax(0,1fr)}}
.sr{position:absolute;left:-9999px}

/* Contrôles autocollants : le bord est une ombre, rien ne bouge dans la mise en page */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:16px;padding:13px 24px;border:0;border-radius:999px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-edge);transition:transform 100ms var(--ease-out),box-shadow 100ms var(--ease-out),background 150ms ease;text-decoration:none;min-height:48px;margin-bottom:4px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green-edge)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.alt{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line),0 4px 0 var(--line)}
.btn.alt:active{box-shadow:inset 0 0 0 2px var(--line),0 1px 0 var(--line)}
.btn.sun{background:var(--sun);color:var(--ink);box-shadow:0 4px 0 var(--sun-edge)}
.btn.done{background:var(--green);opacity:1;cursor:default}
.btn.big{font-size:19px;padding:16px 30px;min-height:58px}
.btn.wide{width:100%}
.btn.sm{min-height:40px;padding:8px 16px;font-size:15px}
.btn.icon{width:44px;height:44px;min-height:44px;padding:0}
@media (hover:hover) and (pointer:fine){.btn:hover{background:#197540}.btn.alt:hover{background:#FAFBF9}.btn.sun:hover{background:#FFD25C}}
.chip{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;font-weight:600;border:2px solid var(--line);background:#fff;transition:background 150ms ease,border-color 150ms ease;text-align:left}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
@media (hover:hover) and (pointer:fine){.chip:hover{border-color:#C9D3CB}}
.tag{display:inline-block;padding:8px 15px;border-radius:999px;background:var(--green-wash);color:var(--green-edge);font-weight:600}
.choice{border:2px solid var(--line);border-bottom-width:4px;border-radius:20px;background:#fff;font-weight:700;padding:18px 16px;text-align:center;transition:background 140ms ease,border-color 140ms ease,transform 140ms var(--ease-out);color:var(--ink-2)}
.choice:active{transform:scale(.98)}
.choice[aria-checked="true"],.choice[aria-pressed="true"]{background:var(--green-wash);border-color:var(--green);color:var(--green-edge)}
@media (hover:hover) and (pointer:fine){.choice:hover{border-color:#C9D3CB}}
.who{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:700;border-radius:999px;padding:4px 12px;white-space:nowrap}
.who i{width:8px;height:8px;border-radius:50%;display:inline-block}
.who.ai{background:var(--ai-wash);color:var(--ai)}
.who.hu{background:var(--human-wash);color:var(--human)}.who.hu i{background:var(--human-dot)}
.who.pa{background:var(--partner-wash);color:var(--partner)}.who.pa i{background:var(--partner)}
.who.ok{background:var(--green-wash);color:var(--green-edge)}.who.ok i{background:var(--green)}
.who.wait{background:var(--sun-wash);color:#7A5300}.who.wait i{background:var(--sun-edge)}
.who .mini{width:20px;height:20px;margin:-3px 0 -3px -4px;display:inline-block;flex:none}
.card{background:#fff;border:2px solid var(--line);border-radius:24px;padding:26px;min-width:0}
.soft{background:var(--wash);border-radius:24px;padding:26px;min-width:0}
.aibox{background:var(--ai-wash);border-radius:24px;padding:26px;min-width:0;color:var(--ai-ink)}
.aibox h2,.aibox h3{color:var(--ai)}
.band{position:relative;border-radius:32px;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) 440px;min-height:220px}
.band .txt{padding:34px 40px;position:relative;z-index:2}
.band .ppl{position:relative;overflow:hidden}
@media (max-width:900px){.band{grid-template-columns:minmax(0,1fr)}.band .ppl{height:170px}.band .ppl .crowd{transform:scale(.84);transform-origin:100% 100%}.band .txt{padding:24px 22px 4px}}
@media (max-width:700px){.ppl-r{transform:scale(.78);transform-origin:100% 100%}.soft:has(.ppl-r){padding-bottom:150px!important}}
.dots{list-style:none;padding:0;margin:0}
.dots li{position:relative;padding:10px 14px 10px 30px;border-radius:16px;background:#fff;margin:8px 0;font-weight:500}
.dots li::before{content:"";position:absolute;left:13px;top:20px;width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.55}
.safe{border-radius:24px;padding:22px 24px;background:var(--partner-wash);color:#0B4F49}
.safe h3{font-size:20px;color:var(--partner);display:flex;gap:10px;align-items:center;margin-bottom:8px}
.safe ul{margin:0;padding-left:20px;line-height:1.7}

/* Barre du haut */
.top{display:flex;align-items:center;gap:22px;padding-block:16px;margin-bottom:20px;flex-wrap:wrap}
.logo{display:flex;align-items:center;height:40px;background:none;border:0;padding:0}
.logo svg{height:40px;width:auto}
.nav{display:flex;gap:4px}
.nav button{padding:10px 18px;border-radius:999px;font-weight:600;color:var(--ink-2);background:none;border:0}
.nav button[aria-current="page"]{background:var(--green-wash);color:var(--green-edge)}
.top .right{margin-left:auto;display:flex;align-items:center;gap:12px}
.count{display:inline-flex;align-items:center;gap:8px;font-weight:700;padding:8px 14px;border-radius:999px;background:var(--sun-wash);color:#7A5300}
.count.pop{animation:cpop 320ms var(--spring)}
@keyframes cpop{50%{transform:scale(1.15)}}
@media (max-width:700px){.nav{order:3;width:100%;justify-content:space-between}.nav button{flex:1;padding:10px 6px;font-size:15px}.count .lbl{display:none}.top{gap:12px;margin-bottom:10px}}

/* Avatars : le personnage entier, dans un rond */
.av{display:inline-block;border-radius:50%;overflow:hidden;flex:none;position:relative;background:var(--ai-wash)}
.av svg{display:block;width:100%;height:100%}

/* Les gens et leur mouvement */
.crowd{position:absolute;display:flex;align-items:flex-end;pointer-events:none;z-index:0}
.pp{flex:none;position:relative;transform-origin:50% 100%}
.pp svg{width:100%;height:100%;display:block}
.pp .body{width:100%;height:100%;transform-origin:50% 100%;animation:bob 3.6s ease-in-out infinite;animation-delay:var(--d,0s);transition:transform 300ms var(--ease-out)}
@keyframes bob{0%,100%{transform:rotate(0)}50%{transform:rotate(var(--tilt,0.8deg))}}
.crowd.enter .pp{animation:popin 420ms var(--ease-out) both;animation-delay:var(--i,0s)}
@keyframes popin{from{transform:translateY(46px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.crowd.cheer .pp .body{animation:jump 520ms var(--ease-out) 1;animation-delay:calc(var(--k,0) * 70ms)}
@keyframes jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-28px) rotate(-2deg)}70%{transform:translateY(-6px)}}
.crowd.walk{animation:drift 70s linear infinite}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.lively .pp{pointer-events:auto}
.lively .pp:hover .body,.pp.wave .body{animation:wave 600ms var(--ease-out)}
@keyframes wave{0%,100%{transform:none}30%{transform:translateY(-10px) rotate(-3deg)}60%{transform:translateY(-2px) rotate(2deg)}}
.pp.hop .body{animation:hop 300ms var(--ease-out)}
@keyframes hop{50%{transform:translateY(-12px)}}
.pp.tilt .body{animation:tilt 300ms var(--ease-out)}
@keyframes tilt{50%{transform:rotate(-4deg)}}

/* Paillettes et toasts (en bas, pour ne jamais cacher la navigation) */
.burst{position:fixed;width:0;height:0;pointer-events:none;z-index:70}
.burst .ring{position:absolute;left:-28px;top:-28px;width:56px;height:56px;border-radius:50%;border:4px solid var(--sun);opacity:0;animation:ring 800ms var(--ease-out)}
.burst .bit{position:absolute;left:0;top:0;opacity:0;animation:pop 900ms cubic-bezier(.2,.8,.3,1) both}
@keyframes ring{0%{transform:scale(.8);opacity:.9}100%{transform:scale(2.3);opacity:0}}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.6);opacity:0}25%{opacity:1}70%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.1) rotate(var(--r));opacity:1}100%{transform:translate(calc(-50% + var(--dx)*1.2),calc(-50% + var(--dy)*1.2)) scale(.7) rotate(var(--r));opacity:0}}
.toasts{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;display:grid;gap:8px;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
.toast{display:flex;align-items:center;gap:12px;background:var(--ink);color:#fff;border-radius:999px;padding:9px 22px 9px 9px;font-weight:700;box-shadow:0 12px 32px rgba(21,32,27,.22);animation:toastin 240ms var(--ease-out) both}
.toast.out{animation:toastout 160ms ease-in both}
.toast .m{width:36px;height:36px;border-radius:50%;background:var(--sun);display:grid;place-items:center;flex:none}
.toast.info .m{background:#3A4741}
.toast small{color:var(--sun);font-size:15px;white-space:nowrap}
@keyframes toastin{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes toastout{to{transform:translateY(16px);opacity:0}}

/* Écrans */
.enterv{animation:viewin 260ms var(--ease-out)}
@keyframes viewin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Accueil */
.hero{padding-top:28px}
.hero h1{font-size:clamp(40px,5.2vw,64px);line-height:1.02;max-width:620px}
.hero-art{position:relative;min-height:520px;align-self:start;border-radius:32px;background:var(--green-wash);overflow:hidden}
.group{left:50%;bottom:0;width:600px;display:block;transform:translateX(-50%) scale(var(--gs,1));transform-origin:50% 100%}
.group .slot-p{position:absolute}
.hero-art .card{position:absolute;left:24px;top:24px;right:24px;max-width:400px;border:0;z-index:3}
.steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:40px}
.steps3 div{background:var(--wash);border-radius:20px;padding:16px 18px;font-weight:600}
.steps3 b{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--sun);margin-bottom:8px;font-family:var(--display)}
@media (max-width:900px){.hero{padding-top:4px}.hero-art{min-height:300px;order:2}.hero-art .card{display:none}.steps3{grid-template-columns:minmax(0,1fr)}}

/* Questionnaire */
.qhead{display:flex;align-items:center;gap:16px;padding-block:18px}
.prog{flex:1;min-width:120px;height:16px;border-radius:99px;background:var(--wash);overflow:hidden}
.prog i{display:block;height:100%;width:100%;background:var(--green);border-radius:99px;transform-origin:0 50%;transition:transform 300ms var(--ease-out)}
.qleft{font-weight:700;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.qwrap{max-width:860px;margin:0 auto;position:relative;z-index:2;padding-top:28px;padding-bottom:170px}
.qcard{transition:transform 150ms var(--ease-out),opacity 150ms var(--ease-out)}
.qcard.out{transform:translateX(-24px);opacity:0}
.qcard.in{transform:translateX(24px);opacity:0;transition:none}
.qcard.in2{transition:transform 220ms var(--ease-out),opacity 220ms var(--ease-out)}
.qq{font-size:clamp(32px,4.6vw,56px);margin:6px 0 4px}
.lik{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:30px 0 26px}
.lik .choice{display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px 8px 16px}
.lik .c{width:30px;height:30px;border-radius:50%;border:3px solid var(--control);display:grid;place-items:center;transition:background 140ms,border-color 140ms}
.lik .choice[aria-checked="true"] .c{background:var(--green);border-color:var(--green)}
@media (max-width:700px){.lik{grid-template-columns:minmax(0,1fr);gap:8px}.lik .choice{flex-direction:row;justify-content:flex-start;padding:13px 18px}}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:28px 0}
@media (max-width:700px){.opts{grid-template-columns:minmax(0,1fr)}}
.kbd{display:none}
@media (hover:hover) and (pointer:fine){.kbd{display:inline}}
.frieze{position:fixed;left:0;right:0;bottom:0;height:142px;overflow:hidden;opacity:.8;pointer-events:none;z-index:0}
@media (max-width:700px){.qhead{flex-wrap:wrap;gap:10px 14px}.qhead .prog{order:3;flex-basis:100%}.qhead .qleft{margin-left:auto}.frieze{height:120px;opacity:.4}.frieze .crowd{transform:scale(.72);transform-origin:0 100%}.qwrap{padding-bottom:120px;padding-top:10px}}
.msg{display:flex;gap:14px;align-items:flex-end;margin:16px 0}
.msg.new{animation:msgin 220ms var(--ease-out) both}
@keyframes msgin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.msg .bub{max-width:560px;border-radius:24px;padding:15px 19px;font-size:18px;font-weight:500}
.msg.ai .bub{background:var(--ai-wash);color:var(--ai-ink);border-bottom-left-radius:8px}
.msg.me{justify-content:flex-end}
.msg.me .bub{background:var(--green-wash);color:#0F4A2A;border-bottom-right-radius:8px}
.msg .who-n{font-size:14px;font-weight:700;color:var(--ai);margin-bottom:6px}
.orbwrap{flex:none;width:72px;height:72px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:inset 0 0 0 2px var(--ai-wash)}
.orb64{width:64px;height:64px;flex:none}
.chatform{display:grid;gap:12px;margin-top:22px}
.chatform .row{justify-content:flex-start}
.input{font:inherit;font-size:17px;padding:15px 22px;border-radius:999px;border:2px solid var(--control);width:100%;min-width:0;background:#fff;color:var(--ink)}
.input:focus{border-color:var(--green);outline:none}
textarea.input{border-radius:20px;resize:vertical;min-height:140px;line-height:1.6}
.peek{margin-top:16px;font-size:15px;color:var(--ai-ink)}
.peek summary{cursor:pointer;font-weight:700;color:var(--ai);list-style:none;display:inline-flex;align-items:center;gap:6px}
.peek summary::-webkit-details-marker{display:none}
.peek summary::before{content:"{ }";font-family:ui-monospace,monospace;font-size:13px;background:var(--ai-wash);border-radius:8px;padding:2px 6px}
.peek pre{background:#0F1E33;color:#CFE2FA;border-radius:16px;padding:14px 16px;overflow:auto;max-height:260px;font-size:13px;line-height:1.5;margin:10px 0 6px;white-space:pre-wrap;word-break:break-word}

/* Génération */
.gendisk{width:150px;height:150px;border-radius:50%;background:var(--ai-wash);display:grid;place-items:center;margin:40px auto 34px}
.tick{list-style:none;padding:0;margin:0}
.tick li{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:#fff;margin:8px 0;font-weight:500}
.ck{flex:none;width:26px;height:26px;border-radius:50%;border:3px solid var(--control);display:grid;place-items:center;background:#fff;padding:0;transition:background 150ms ease,border-color 150ms ease}
.ck[aria-checked="true"]{background:var(--green);border-color:var(--green)}

/* Profil */
.rb{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) 84px;gap:14px;align-items:center;margin:12px 0 2px;font-weight:600}
.rb .tr{height:14px;border-radius:99px;background:var(--wash);overflow:hidden}
.rb .tr i{display:block;height:100%;width:100%;border-radius:99px;background:var(--green);transform-origin:0 50%;transform:scaleX(0);transition:transform 600ms var(--ease-out)}
.rb.lo{color:var(--ink-2)}.rb.lo .tr i{background:#B9C7BE}
.rb b{text-align:right;font-size:15px}
.rbd{font-size:15px;color:var(--ink-2);margin:0 0 6px}
@media (max-width:560px){.rb{grid-template-columns:minmax(0,110px) minmax(0,1fr) 74px;gap:10px}}
.job{display:flex;align-items:center;gap:16px;padding:16px 18px;border-radius:20px;background:var(--wash);margin-bottom:10px;width:100%;border:0;text-align:left;transition:transform 160ms var(--ease-out)}
.job:active{transform:scale(.99)}
@media (hover:hover) and (pointer:fine){.job:hover{transform:translateX(3px)}}
.job .go{margin-left:auto;width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none}
.medal{flex:none;width:96px;height:96px;border-radius:50%;background:var(--sun);box-shadow:0 6px 0 var(--sun-edge);display:grid;place-items:center}
.medal.go{animation:medal 520ms var(--spring)}
@keyframes medal{0%{transform:scale(.9)}55%{transform:scale(1.08)}100%{transform:none}}

/* Chemin */
.path{position:relative}
.steps{position:relative;z-index:2;display:grid;gap:26px;padding:80px 28px 30px}
.step{display:grid;grid-template-columns:64px minmax(0,1fr);gap:16px;align-items:start}
.node{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;border:3px solid var(--control);background:#fff;box-shadow:0 5px 0 var(--line);position:relative;transition:background 200ms var(--ease-out),border-color 200ms,box-shadow 200ms;padding:0}
.node[aria-checked="true"]{background:var(--green);border-color:var(--green);box-shadow:0 5px 0 var(--green-edge)}
.node.goal{background:var(--sun);border-color:var(--sun);box-shadow:0 5px 0 var(--sun-edge);cursor:default}
.node.now{background:#fff;border-color:var(--green);box-shadow:0 5px 0 var(--green-wash);cursor:default}
.node.now::after{content:"";width:14px;height:14px;border-radius:50%;background:var(--green)}
.node.past{background:#E9ECEA;border-color:#D5DBD7;box-shadow:0 5px 0 #CBD2CD;cursor:default}
.step.past b{color:var(--ink-2)}
.rail{position:absolute;width:8px;border-radius:4px;background:repeating-linear-gradient(to bottom,#D7DED8 0 8px,transparent 8px 22px);z-index:1}
.rail i{position:absolute;left:0;top:0;width:8px;height:100%;border-radius:4px;background:var(--green);transform-origin:50% 0;transform:scaleY(0);transition:transform 500ms var(--ease-out)}
.walker{position:absolute;z-index:4;transition:transform 420ms var(--ease-out);pointer-events:none}
.step.extra.flash{animation:flash 1.6s var(--ease-out)}

.jedge{fill:none;stroke:#EFDFAE;stroke-width:36;stroke-linecap:round}
.jroad{fill:none;stroke:#FFFFFF;stroke-width:30;stroke-linecap:round}

.journey.still .jprog,.journey.still #jmaskp,.journey.still .jnode,.journey.still .jcard,.journey.still .jme{transition:none!important}
.jnode{position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--ink);border:3px solid #E3D29C;z-index:3;font-family:var(--display);font-weight:800;font-size:22px;opacity:0;transition:opacity 300ms var(--ease-out),background 200ms,border-color 200ms}
.jnode.in{opacity:1}
.jnode.done{background:var(--green);border-color:var(--green);color:#fff}
.jnode.past{background:#EEE7D2;border-color:#DCD2B4;color:#8A8470}
.jnode.next{border-color:var(--green);box-shadow:0 0 0 6px var(--green-wash)}

.jcard{position:absolute;z-index:4;background:#fff;color:var(--ink);border:2px solid #F0E2B6;border-radius:22px;padding:16px 18px;opacity:0;transform:translateY(10px);transition:opacity 360ms var(--ease-out),transform 360ms var(--ease-out),border-color 200ms}

.jcard.next{border-color:var(--green);box-shadow:0 0 0 4px var(--green-wash)}

.jcard.goal{background:var(--sun-wash);border-color:#F4D77A}
.jcard.goal .yr{background:var(--sun);color:var(--ink)}

.jcard.flash{animation:cflash 1.2s var(--ease-out)}
@keyframes cflash{30%{transform:scale(1.03)}}
.jcard .t{display:block;font-size:19px;line-height:1.25}
.jcard .s{color:var(--ink-2);font-size:16px;margin-top:4px}
.jcard .tagl{margin-top:8px}
.jcard .act{margin-top:12px}
.jdone{border:0;border-radius:999px;padding:10px 16px;font-weight:700;font-size:15px;background:var(--wash);color:var(--ink);display:inline-flex;gap:6px;align-items:center;box-shadow:0 3px 0 var(--line);transition:transform 100ms var(--ease-out),box-shadow 100ms,background 150ms}
.jcard.next .jdone{background:var(--green);color:#fff;box-shadow:0 3px 0 var(--green-edge)}

.jdone[aria-pressed="true"]{background:var(--green-wash);color:var(--green-edge);box-shadow:0 3px 0 #BFE3CB}

@media (max-width:700px){.jhead{padding:24px 20px 4px}.jstat{justify-items:start}.jnode{width:44px;height:44px;margin:-22px 0 0 -22px;font-size:19px}.jnode.goal{width:58px;height:58px;margin:-29px 0 0 -29px}.jroad{stroke-width:22}.jedge{stroke-width:28}}
/* Pros */

/* Rapport imprimable */
.paper{max-width:820px;margin:0 auto;background:#fff;border:2px solid var(--line);border-radius:12px;padding:44px 48px}

/* Copilote : pré-échange */
.prephead{display:flex;gap:20px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.promini{display:flex;gap:12px;align-items:center;background:var(--human-wash);border-radius:22px;padding:10px 18px 10px 10px;min-width:0}
.g-prep{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:24px;margin-top:22px;align-items:start}
@media (max-width:900px){.g-prep{grid-template-columns:minmax(0,1fr)}}
.chatbox{background:#fff;border:2px solid #CFE0F5;border-radius:28px;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.chathead{display:flex;gap:12px;align-items:center;padding:12px 18px;background:var(--ai-wash);color:var(--ai-ink);flex-wrap:wrap}
.chathead b{font-size:18px}
.pmsgs{padding:4px 18px 10px;height:min(52vh,520px);min-height:300px;overflow:auto;scroll-behavior:smooth}
.pmsgs .msg{margin:14px 0}
.pmsgs .msg .bub{font-size:17px;max-width:520px}
.pmsgs .orbwrap{width:48px;height:48px}
.qadd{display:inline-flex;gap:6px;align-items:center;margin-top:8px;font-size:14px;font-weight:700;color:var(--ai);background:#fff;border-radius:999px;padding:4px 12px;box-shadow:inset 0 0 0 2px #CFE0F5}
.quick{display:flex;gap:8px;flex-wrap:wrap;padding:6px 18px 0}
.quick button{border:2px solid #CFE0F5;background:#fff;color:var(--ai-ink);border-radius:999px;padding:8px 14px;font-weight:700;font-size:15px}
@media (hover:hover) and (pointer:fine){.quick button:hover{background:var(--ai-wash)}}
.pform{display:flex;gap:10px;padding:12px 18px 6px}
.pform .btn{flex:none;margin-bottom:0}
.chatnote{padding:4px 18px 16px}
.brief{background:var(--human-wash);border-radius:28px;padding:24px;min-width:0}
.blist{list-style:none;margin:14px 0;padding:0;display:grid;gap:10px}
.bq{background:#fff;border-radius:18px;padding:12px 14px;border:2px solid transparent}
.bq.proposed{border:2px dashed #B9D2EF}
.bq.kept{border-color:#CDEBD7}
.bq.flash{animation:cflash 1.2s var(--ease-out)}
.bq p{font-weight:600;margin:6px 0 8px}
.bact{display:flex;gap:6px;flex-wrap:wrap}
.bact button{border:0;border-radius:999px;padding:7px 13px;font-weight:700;font-size:14px;background:var(--wash);min-height:36px}
.bact button.k{background:var(--green);color:#fff}
.propose{margin-top:16px;background:#fff;border-radius:20px;padding:16px;border:2px dashed #B9D2EF}
.calls>div{display:grid;grid-template-columns:minmax(0,1fr) auto 70px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.calls>div:last-child{border-bottom:0}
.order{margin:8px 0 0;padding-left:22px;line-height:1.7}

/* corrections après relecture */
.mobonly{display:none}
@media (max-width:900px){.mobonly{display:inline-flex}.pmsgs{height:min(62vh,560px)}}
.aifab .ob{overflow:hidden}
.aifab .ob [data-orb]{width:30px;height:30px;display:block;overflow:hidden}
.aifab .ob canvas,.aifab .ob svg{width:30px!important;height:30px!important}
@media (max-width:700px){.aifab{padding:5px;gap:0}.aifab .lbl{display:none}}
.input:focus{box-shadow:0 0 0 4px rgba(28,130,71,.22)}
@media (max-width:600px){.propose,.added{padding:12px}}

/* Hub v6.2 : plus direct */
.hubtop{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:stretch}
.hello2{display:flex;gap:14px;align-items:center;background:var(--green-wash);border-radius:22px;padding:12px 18px;min-width:0}
.hello2 h1{font-size:clamp(24px,2.6vw,30px)}
.hello2 p{color:var(--ink-2);font-weight:600;font-size:15px;margin-top:2px}
.copilot2{display:flex;gap:10px;align-items:center;background:var(--ai-wash);color:var(--ai);border-radius:22px;padding:10px 14px;flex-wrap:wrap}
.copilot2 b{font-family:var(--display);font-size:19px}
.copilot2 .ob2{width:42px;height:42px;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden;flex:none}
.copilot2 .ob2 [data-orb]{width:36px;height:36px;display:block;overflow:hidden}
.copilot2 .ob2 canvas,.copilot2 .ob2 svg{width:36px!important;height:36px!important}
.hcard h2 .lnk{font-family:var(--text);font-size:15px;letter-spacing:0}
.hubgrid .hx{min-height:40px;padding:8px 14px;font-size:14px}
.c3{grid-column:span 3}.c12{grid-column:span 12}
.hubgrid .nextact{padding:22px}
.hubgrid .nextact .t{font-size:clamp(22px,2.2vw,26px);margin:12px 0 6px}
.hubgrid .hitl{border-top:0;padding-top:4px}
.opp2{display:grid;gap:3px;padding:10px 0;border-bottom:1px solid var(--line)}
.opp2:last-child{border-bottom:0}
.opp2 .who{justify-self:start;font-size:13px;padding:2px 10px}
.opp2 b{font-size:16px;line-height:1.3}
.agenda2 .ag{display:grid;gap:2px;padding:9px 0 9px 12px;border-left:4px solid var(--line);margin-bottom:8px}
.agenda2 .ag.hu{border-color:var(--human-dot)}.agenda2 .ag.pa{border-color:var(--partner)}.agenda2 .ag.ok{border-color:var(--green)}
.agenda2 b{font-size:14px;color:var(--ink-2)}
.agenda2 span{font-weight:600;line-height:1.3}
@media (max-width:1150px){.c3{grid-column:span 6}}
@media (max-width:900px){.hubtop{grid-template-columns:minmax(0,1fr)}}
@media (max-width:700px){.hubgrid>*{grid-column:span 12}.copilot2 .btn{margin-left:0!important}}

// Foule de l'accueil, façon Open Peeps : trois rangs serrés, épaule contre épaule. Chaque rang se place dans les
// espaces du rang de devant ; sa ligne de coupe est cachée par les corps du rang de devant. Rien ne déborde : le groupe
// entier est mis à l'échelle de son panneau (fitGroups).
function group(rows,fw=170){
  // 2 rangées qui vont d'un bord à l'autre : 5 personnes devant, 6 derrière (plus serrées, dans les espaces du rang de devant).
  // Même taille pour tous ; le rang de derrière est caché à partir des épaules par le rang de devant. Mis à l'échelle du panneau (fitGroups).
  const fh=fw*RATIO,rise=Math.round(fh*.4),n=rows[0].length,span=Math.round(fw*.66*(n-1)+fw);let h='',k=0;
  rows.forEach((ids,r)=>{const m=ids.length,st=m>1?(span-fw)/(m-1):0,bot=rise*r;
    ids.forEach((id,i)=>{const z=(rows.length-r)*10+(i%2);
      h+=`<div class="slot-p" style="left:${Math.round(st*i)}px;bottom:${bot}px;z-index:${z}">${person(id,fw,k++,'',0)}</div>`})});
  const top=Math.ceil(rise*(rows.length-1)+fh);
  return `<div class="group crowd enter lively" data-h="${top}" data-w="${span}" style="position:absolute;height:${top}px;width:${span}px">${h}</div>`;
}

// ---- Le chemin : une route qui serpente, l'avatar qui avance, le tracé qui se dessine
let JR=null;
const jEase=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function jLastDone(){const nodes=$$('#jbody .jnode');let k=0;for(let i=0;i<nodes.length;i++){const n=nodes[i];if(n.classList.contains('done')||n.classList.contains('past'))k=i;else break}return k}
function journeyLayout(anim,keepAt){
  const body=$('#jbody'); if(!body) return;
  const W=body.clientWidth, mob=W<700, cards=$$('.jcard',body), nodes=$$('.jnode',body), n=cards.length;
  const A=Math.min(170,W*.15), cx=W/2, xs=[], ys=[], hs=[];
  const cw=mob?W-104:Math.min(340,cx-A-62);
  cards.forEach((c,i)=>{const x=mob?40+(i%2?24:0):cx+(i%2?A:-A);xs.push(x);c.style.width=cw+'px';c.style.left=(mob?94:(i%2?x+48:x-48-cw))+'px';});
  cards.forEach(c=>hs.push(c.offsetHeight));
  for(let i=0;i<n;i++){ if(i===0){ys.push((mob?40:56)+hs[0]/2);continue}
    let y=mob?ys[i-1]+hs[i-1]/2+hs[i]/2+24:ys[i-1]+Math.max(128,(hs[i-1]+hs[i])/4+52);
    if(!mob&&i>1) y=Math.max(y,ys[i-2]+(hs[i]+hs[i-2])/2+28);
    ys.push(y)}
  body.style.height=(ys[n-1]+hs[n-1]/2+(mob?40:70))+'px';
  cards.forEach((c,i)=>{c.style.top=(ys[i]-hs[i]/2)+'px'});
  nodes.forEach((nd,i)=>{nd.style.left=xs[i]+'px';nd.style.top=ys[i]+'px'});
  // la route
  let d=`M${xs[0]} ${ys[0]-60} L${xs[0]} ${ys[0]}`; const pre=[];
  for(let i=1;i<n;i++){const dy=ys[i]-ys[i-1];d+=` C${xs[i-1]} ${ys[i-1]+dy*.55} ${xs[i]} ${ys[i]-dy*.55} ${xs[i]} ${ys[i]}`}
  ['jedge','jroad','jdash','jprog','jmaskp'].forEach(id=>$('#'+id).setAttribute('d',d));
  const road=$('#jroad'), tmp=document.createElementNS('http://www.w3.org/2000/svg','path'); $('#jsvg').appendChild(tmp);
  const Ls=[]; let dd=`M${xs[0]} ${ys[0]-60} L${xs[0]} ${ys[0]}`; tmp.setAttribute('d',dd); Ls.push(tmp.getTotalLength());
  for(let i=1;i<n;i++){const dy=ys[i]-ys[i-1];dd+=` C${xs[i-1]} ${ys[i-1]+dy*.55} ${xs[i]} ${ys[i]-dy*.55} ${xs[i]} ${ys[i]}`;tmp.setAttribute('d',dd);Ls.push(tmp.getTotalLength())}
  tmp.remove(); const total=road.getTotalLength(); JR={Ls,total,cur:JR&&JR.cur};
  const prog=$('#jprog'), mask=$('#jmaskp'), J=$('#journey'); const Lp=Ls[jLastDone()];
  prog.style.strokeDasharray=mask.style.strokeDasharray=total+' '+total;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!anim||reduce){J.classList.add('still');mask.style.strokeDashoffset=0;prog.style.strokeDashoffset=total-(keepAt??Lp);nodes.forEach(x=>x.classList.add('in'));cards.forEach(x=>x.classList.add('in'));jPlace(keepAt??Lp);JR.cur=keepAt??Lp;requestAnimationFrame(()=>J.classList.remove('still'));return}
  // entrée : la route se dessine, les étapes apparaissent quand elle les atteint, puis l'avatar avance
  J.classList.add('still');mask.style.strokeDashoffset=total;prog.style.strokeDashoffset=total;jPlace(Ls[0]);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{J.classList.remove('still');mask.style.strokeDashoffset=0;
    nodes.forEach((x,i)=>setTimeout(()=>x.classList.add('in'),900*Ls[i]/total));
    cards.forEach((x,i)=>setTimeout(()=>x.classList.add('in'),60+900*Ls[i]/total));
    setTimeout(()=>{prog.style.strokeDashoffset=total-Lp;jWalk(Ls[0],Lp,800)},850)}));
  JR.cur=Lp;
}
function jPlace(L){const me=$('#jme'),road=$('#jroad');if(!me||!road)return;const p=road.getPointAtLength(Math.max(0,L));me.style.transform=`translate(${p.x-21}px,${p.y-66}px)`}
function jWalk(L0,L1,dur){const t0=performance.now();
  const f=t=>{const k=Math.min(1,(t-t0)/dur);jPlace(L0+(L1-L0)*jEase(k));if(k<1&&$('#jme'))requestAnimationFrame(f)};requestAnimationFrame(f)}
function journeyToggle(btn){
  const key=btn.dataset.jstep; S.steps[key]=!S.steps[key]; save(); const on=!!S.steps[key];

  const prog=$('#jprog'); const J=$('#journey');

}

 paul:{retiens:["Arrêter la fac après un an n'est pas un trou dans un CV : ça se raconte comme un choix.","Le BUT, c'est surtout des TP : on voit vite le résultat de ce qu'on fait.","Pour l'alternance, il faut viser large : Lorys a envoyé 30 candidatures."],etape:{titre:"Aller aux portes ouvertes de l'IUT",quand:"en février"},merci:"Merci Lorys d'avoir pris le temps. Savoir que tu es passé par là aussi m'a enlevé un poids."},

function localReport(notes){
  for(const k in DEMO_NOTES){if(notes.trim()===DEMO_NOTES[k].trim())return structuredClone(DEMO_REPORT[k])}
  const lines=notes.split('\n').map(x=>x.replace(/^[-•*]\s*/,'').trim()).filter(Boolean);
  const adv=lines.find(l=>/conseil|faire|essaie|commence/i.test(l))||lines[lines.length-1]||"Préparer ses vœux";
  const ret=lines.filter(l=>l!==adv).slice(0,3).map(dot);
  while(ret.length<3) ret.push(["Le métier a l'air de te correspondre.","Il existe plusieurs chemins pour y arriver.","L'alternance est une vraie option."][ret.length]);
  return {retiens:ret,etape:{titre:cap(adv.replace(/^conseil\s*:\s*/i,'')).slice(0,60),quand:"dans les 2 prochains mois"},merci:"Merci pour ton temps et tes conseils. Grâce à toi, j'y vois beaucoup plus clair."};
}

}

function ago(t){const s=(Date.now()-t)/1000;if(s<60)return "à l'instant";if(s<3600)return `il y a ${Math.round(s/60)} min`;if(s<86400)return `il y a ${Math.round(s/3600)} h`;const d=Math.round(s/86400);return d<=1?'hier':`il y a ${d} jours`}
function logHTML(n){const L=(S.log||[]).slice(0,n);if(!L.length)return `<p class="muted">Rien pour l'instant. Chaque fois que l'IA te propose quelque chose, ta décision s'affiche ici.</p>`;

  report:{quoi:()=>`Compte rendu de l'échange avec ${proOf().nom}`,ia:()=>'a résumé tes notes en 3 points',get:()=>S.report.retiens.join('\n'),
    set:v=>{if(!S.report.retiensIA)S.report.retiensIA=S.report.retiens;S.report.retiens=v.split('\n').map(x=>x.replace(/^[-•*]\s*/,'').trim()).filter(Boolean).slice(0,5)},
    undo:()=>{if(S.report.retiensIA){S.report.retiens=S.report.retiensIA;S.report.retiensIA=null}}},
  step:{quoi:()=>`Étape proposée après l'échange avec ${proOf().nom}`,ia:()=>`a proposé « ${S.report.etape.iaTitre||S.report.etape.titre} »`,get:()=>S.report.etape.titre,set:v=>{if(!S.report.etape.iaTitre)S.report.etape.iaTitre=S.report.etape.titre;S.report.etape.titre=v},
    after:d=>{if(d==='refusé')return;const a=proOf();S.extras=[...(S.extras||[]),{titre:S.report.etape.titre,quand:S.report.etape.quand,de:a.nom,sid:'r'+(S.past||[]).length}];
      setTimeout(()=>{updateCount(true);const o=$('#added .ok');if(o)burst(o,'sm');toast('Ton chemin a une nouvelle étape','+1 étape')},120)},
    undo:()=>{const sid='r'+(S.past||[]).length;S.extras=(S.extras||[]).filter(x=>x.sid!==sid);if(S.report.etape.iaTitre){S.report.etape.titre=S.report.etape.iaTitre;S.report.etape.iaTitre=null}}},
  alv:{quoi:'Fiche du jeune, préparée pour le pro',ia:()=>'a résumé le profil en 3 phrases',get:()=>(S.alv||localAlv()).resume,set:v=>{const A=S.alv||localAlv();S.alv={...A,resumeIA:A.resumeIA||A.resume,resume:v}},

  const sl=t.closest('[data-slot]'); if(sl&&!sl.disabled){const [id,k]=sl.dataset.slot.split(':');S.pick=id;S.slot=+k;save();render(false);const pp=$(`[data-al="${id}"] .pp`);if(pp){pp.classList.add('wave');setTimeout(()=>pp.classList.remove('wave'),650)}return}
  const pk=t.closest('[data-pick]'); if(pk){S.pick=pk.dataset.pick;S.slot=0;S.alFilter='all';save();go('alumni');return}
  const rq=t.closest('[data-req]'); if(rq){const id=rq.dataset.req; if(rq.classList.contains('done'))return; if(S.rdv&&S.rdv.id===id&&S.rdv.status!=='done')return; if(S.pick!==id){S.pick=id;S.slot=0;save();render(false);toast(`Choisis d'abord un créneau chez ${ALUMNI.find(x=>x.id===id).nom}`,null,'info');return}
    if(S.rdv&&S.rdv.status!=='done'&&S.rdv.id!==id){toast(`Tu as déjà une demande en cours avec ${proOf().nom}`,null,'info');return}
    if(S.rdv&&S.rdv.status==='done'){S.past=[...(S.past||[]),{rdv:S.rdv,report:S.report}]}
    S.rdv={id,slot:S.slot,status:'pending'};S.report=null;S.notes='';S.checked={};S.alv=null;S.pick=null;if(S.dec){delete S.dec.step;delete S.dec.report}if(S.briefFor!==id){S.brief=null;S.pchat=[]}S.briefSent=null;logIt(`Échange demandé à ${ALUMNI.find(x=>x.id===id).nom}`,'avait proposé des pros proches de tes pistes','choisi');save();const a=ALUMNI.find(x=>x.id===id);
    rq.className='btn done wide';rq.innerHTML=ICON.check('#fff',20)+' Demande envoyée';burst(rq,'sm');updateCount(true);
    const pp=$(`[data-al="${id}"] .pp`);if(pp)pp.classList.add('wave');
    toast(`Demande envoyée à ${a.nom}`,'+1 étape'); setTimeout(()=>{if(S.view==='alumni')go('rdv')},1200); return}
  const ck=t.closest('[data-chk]'); if(ck){const k=+ck.dataset.chk;S.checked[k]=!S.checked[k];save();ck.setAttribute('aria-checked',String(!!S.checked[k]));ck.innerHTML=S.checked[k]?ICON.check('#fff',15):'';return}
  if(t.closest('#demoNotes')){$('#notes').value=DEMO_NOTES[S.persona]||DEMO_NOTES.yanis;return}
  if(t.closest('#genReport')){const n=$('#notes').value.trim(); if(!n){toast("Écris d'abord quelques notes",null,'info');$('#notes').focus();return}
    S.notes=n;reportBusy=true;save();$('#reportBtns').innerHTML='';$('#report').innerHTML=reportHTML(proOf());orbsNow();
    const t0=Date.now();makeReport().then(R=>setTimeout(()=>{reportBusy=false;S.report=R;if(S.dec){delete S.dec.step;delete S.dec.report}save();
      if(S.view!=='rdv')return;render(false);updateCount(true);const pr=$('.propose');if(pr){pr.scrollIntoView({block:'center',behavior:'smooth'});setTimeout(()=>toast("L'IA propose une étape : à toi de décider",null,'info'),350)}},Math.max(0,1400-(Date.now()-t0))));return}
  const rt=t.closest('[data-rate]'); if(rt){S.rdv.rating=+rt.dataset.rate;save();$$('[data-rate]').forEach(b=>{const k=+b.dataset.rate;b.setAttribute('aria-checked',String(k===S.rdv.rating));b.innerHTML=ICON.star(k<=S.rdv.rating?'#FFC93C':'#DDE3DE',34)});if(S.rdv.rating>=4)burst(rt,'sm');toast('Merci pour ta note',null,'info');return}
  if(t.closest('#thank')){S.rdv.thanked=true;save();const b=$('#thank');burst(b,'sm');b.outerHTML=`<span class="who ok"><i></i>Merci envoyé</span>`;toast(`${proOf().nom} a reçu ton merci`);return}
  if(t.closest('#signal')||t.closest('#signalV')){toast("Signalement envoyé à l'équipe Alumnia (démo)",null,'info');return}
  if(t.closest('#confirm')){S.rdv.status='confirmed';save();render(false);burst($('.who.ok'),'sm');toast(`Échange confirmé. ${ME().nom} est prévenu.`);return}
  if(t.closest('#endCall')){S.rdv.status='done';save();toast('Échange terminé, bravo !','+1 étape');go('rdv');setTimeout(()=>updateCount(true),300);return}
  if(t.closest('#cam')){const b=$('#cam'),m=$('#meTile');const on=b.dataset.on!=='1';b.dataset.on=on?'1':'';b.textContent=on?'Couper ma caméra':'Allumer ma caméra';m.innerHTML=on?av(ME().p,90,'#2A3A34'):'Toi<br>Caméra coupée';return}
  if(t.closest('#mic')){const b=$('#mic');b.textContent=b.textContent==='Micro activé'?'Micro coupé':'Micro activé';return}
  if(t.closest('#print')){try{window.print()}catch(err){toast("Utilise le menu de ton navigateur pour imprimer",null,'info')}return}
  if(t.closest('#pilot')){toast('Demande de pilote envoyée (démo)',null,'info');return}
  if(t.closest('#copyCode')){try{navigator.clipboard.writeText('ALU-7K2Q')}catch(err){}toast('Code copié',null,'info');return}
  if(t.closest('#skipGen')){genToken++;go('profil');return}
  const ac=t.closest('[data-act]'); if(ac){const A=nextAction();const k=ac.dataset.act;
    if(k==='ok'){logIt(`Prochaine action : ${A.t}`,"l'a proposée",'validé');if(A.pick){S.pick=A.pick;S.slot=0;S.alFilter='all';save();go('alumni')}else go(A.go);return}
    if(k==='edit'){S.actEdit=true;save();render(false);const i=$('#actIn');if(i)i.focus();return}
    if(k==='cancel'){S.actEdit=false;save();render(false);return}
    if(k==='no'){S.skipAct={...(S.skipAct||{}),[A.id]:1};logIt(`Prochaine action : ${A.t}`,"l'a proposée",'refusé','pas maintenant');render(false);toast("D'accord. L'IA te propose autre chose.",null,'info');return}}
  const hz=t.closest('[data-hitl]'); if(hz){const [key,act]=hz.dataset.hitl.split(':');const H=HITL[key];S.dec=S.dec||{};
    if(act==='edit'){S.hEdit=key;render(false);const i=$('#hIn');if(i)i.focus();return}
    if(act==='cancel'){S.hEdit=null;render(false);return}
    if(act==='reset'){H.undo&&H.undo(S.dec[key]);delete S.dec[key];save();render(false);updateCount();return}
    const d=act==='ok'?'validé':'refusé';const ia=H.ia();if(act==='no'&&H.no)H.no();S.dec[key]=d;H.after&&H.after(d);logIt(H.quoi,ia,d);render(false);
    if(key!=='step')toast(d==='validé'?'Validé par toi':"Refusé : c'est noté",null,'info');return}
  const bq=t.closest('[data-bq]'); if(bq){const [i,act]=bq.dataset.bq.split(':');const B=S.brief||[];
    if(act==='restore'){B.forEach(b=>{if(b.st==='removed')b.st='proposed'})}
    else{const b=B[+i];if(!b)return;
      if(act==='keep')b.st='kept'; if(act==='drop'){b.st='removed';if(S.bEdit===+i)S.bEdit=null} if(act==='edit')S.bEdit=+i; if(act==='cancel')S.bEdit=null;}
    save();render(false);if(act==='edit'){const x=$('#bqIn');if(x){x.focus();x.select()}}
    else{const f=act==='keep'?$(`[data-bq="${i}:edit"]`):act==='drop'||act==='cancel'?($(`[data-bq="${+i+1}:keep"],[data-bq="${+i+1}:edit"]`)||$('#bin')):$('#bin');if(f)f.focus({preventScroll:true})}return}
  const scr=t.closest('[data-scroll]'); if(scr){const el=$('#'+scr.dataset.scroll);if(el){el.scrollIntoView({behavior:'smooth',block:'start'});el.setAttribute('tabindex','-1');el.focus({preventScroll:true})}return}
  const pq=t.closest('[data-pq]'); if(pq){pSend(pq.dataset.pq);return}
  const hq=t.closest('[data-hq]'); if(hq){S.pendingAsk=hq.dataset.hq;save();go('prep');return}
  if(t.closest('[data-human]')){logIt("Demande d'aide humaine","t'a mis en lien avec l'équipe",'choisi');toast("Message transmis à l'équipe Alumnia : un humain te répond sous 24 h (démo)",null,'info');return}
  if(t.closest('#sendBrief')){const a=proOf();const B=S.brief||[];const kept=B.filter(b=>b.st==='kept');if(!kept.length)return;
    S.briefSent=Date.now();S.checked={};const nIA=B.filter(b=>b.src==='ia').length,rem=B.filter(b=>b.st==='removed').length,own=kept.filter(b=>b.src==='toi').length,ed=kept.filter(b=>b.edited).length;
    logIt(`Brief envoyé à ${a.nom}`,`a proposé ${nIA} questions`,'envoyé',`${kept.length} gardée${kept.length>1?'s':''}${ed?`, ${ed} modifiée${ed>1?'s':''}`:''}${rem?`, ${rem} retirée${rem>1?'s':''}`:''}${own?`, ${own} de toi`:''}`);
    render(false);const ok=$('.brief .who.ok');if(ok)burst(ok,'sm');toast(`${a.nom} a reçu ton brief`,'+1 étape');return}
  if(t.closest('#unsend')){S.briefSent=null;save();render(false);return}
  if(t.closest('#oaiSave')){const k=$('#oaiKey').value.trim();S.oaiModel=$('#oaiModel').value.trim()||'gpt-4.1-mini';if(k)OAI.key=k;save();
    if(!OAI.key){toast("Colle d'abord ta clé API OpenAI",null,'info');$('#oaiKey').focus();return}
    OAI.err='';render(false);toast(`OpenAI activé pour cet onglet (${oaiModel()})`,null,'info');return}
  if(t.closest('#oaiForget')){OAI.key='';OAI.err='';render(false);toast('Clé oubliée',null,'info');return}
  if(t.closest('#oaiTest')){const m=$('#oaiMsg');m.textContent='Test en cours…';
    ai('test','Dis bonjour en 3 mots, en français.',{},'{"bonjour":"3 mots"}',()=>({bonjour:'(version de secours)'})).then(r=>{const c=S.ai.test;if(S.view!=='ia')return;render(false);const mm=$('#oaiMsg');if(mm)mm.textContent=c.mode==='openai'?`OpenAI répond (${c.ms} ms) : « ${r.bonjour} »`:c.mode==='direct'?`OpenAI injoignable${OAI.err?' ('+OAI.err+')':''} : l'IA en direct a répondu à la place.`:`Aucune IA joignable${OAI.err?' ('+OAI.err+')':''} : la version de secours prend le relais.`});return}
  if(t.closest('#loginBtn')){$('#loginMsg').textContent="Regarde ta boîte mail : le lien arrive. (Démo : on t'emmène au questionnaire.)";setTimeout(()=>{if(S.view==='login')startAs('yanis')},1400);return}
});
document.addEventListener('submit',e=>{
  if(e.target.id==='chatForm'){e.preventDefault();const v=$('#chatIn').value.trim();if(!v)return;chatSend(v)}
  if(e.target.id==='pform'){e.preventDefault();const v=$('#pin').value.trim();if(v)pSend(v)}
  if(e.target.id==='hubAsk'){e.preventDefault();const v=$('#hubIn').value.trim();if(!v){$('#hubIn').focus();return}S.pendingAsk=v;save();go('prep')}
  if(e.target.id==='bform'){e.preventDefault();const v=$('#bin').value.trim();if(!v)return;S.brief.push({t:/[?!.…]$/.test(cap(v))?cap(v):cap(v)+' ?',src:'toi',st:'kept',fresh:1});save();render(false);setTimeout(()=>{S.brief.forEach(b=>delete b.fresh);save()},60);const i=$('#bin');if(i)i.focus()}
  if(e.target.dataset&&e.target.dataset.bqform!=null){e.preventDefault();const i=+e.target.dataset.bqform;const v=$('#bqIn').value.trim();if(!v)return;const b=S.brief[i];if(b.t!==v){b.t=v;b.edited=true}b.st='kept';S.bEdit=null;save();render(false)}
  if(e.target.id==='actForm'){e.preventDefault();const v=$('#actIn').value.trim();if(!v){$('#actIn').focus();return}const A=nextAction();
    S.extras=[...(S.extras||[]),{titre:cap(v),quand:'cette semaine',de:'toi'}];S.skipAct={...(S.skipAct||{}),[A.id]:1};S.actEdit=false;
    logIt(`Prochaine action : ${A.t}`,"l'a proposée",'modifié',`ta version : « ${cap(v)} »`);render(false);updateCount(true);toast('Ajouté à ton chemin','+1 étape')}
  if(e.target.dataset&&e.target.dataset.hform){e.preventDefault();const key=e.target.dataset.hform;const H=HITL[key];const v=$('#hIn').value.trim();if(!v){$('#hIn').focus();return}
    const ia=H.ia();H.set(v);S.dec=S.dec||{};S.dec[key]='modifié';S.hEdit=null;H.after&&H.after('modifié');logIt(H.quoi,ia,'modifié',`ta version : « ${v.length>60?v.slice(0,57)+'…':v} »`);render(false);if(key!=='step')toast('Ta version est gardée',null,'info')}
});
document.addEventListener('keydown',e=>{
  const grp=e.target.closest&&e.target.closest('[role=radiogroup],[role=group]');
  if(grp&&['ArrowRight','ArrowDown','ArrowLeft','ArrowUp'].includes(e.key)){const bs=$$('button',grp);const i=bs.indexOf(e.target);if(i>-1){e.preventDefault();const j=(i+(['ArrowRight','ArrowDown'].includes(e.key)?1:-1)+bs.length)%bs.length;bs[j].focus()}return}
  const typing=/input|textarea/i.test(document.activeElement.tagName);
  if(S.view==='questionnaire'&&/^[1-5]$/.test(e.key)&&!typing) answer(+e.key);
  if(e.key==='Escape'){const was=!$('#demoPanel').hidden;togglePanel(false);if(was)$('#demoBtn').focus()}
  if((e.key==='d'||e.key==='D')&&!typing&&S.tournage){S.tournage=false;save();applyTournage();toast('Bouton Démo de retour',null,'info')}
});
function togglePanel(force){const p=$('#demoPanel'),b=$('#demoBtn');const open=force===undefined?p.hidden:force;p.hidden=!open;b.setAttribute('aria-expanded',String(open));if(open){const f=$('button',p);if(f)f.focus()}}
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.demo'))togglePanel(false)});
function applyTournage(){document.body.classList.toggle('tournage',!!S.tournage)}
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{fitGroups();if(S.view==='roadmap')journeyLayout(false)},120)});

// démarrage
(function start(){ const h=(location.hash||'').slice(1);
  if(h==='tournage'){S.tournage=true} else if(h&&Object.hasOwn(V,h)) S.view=h;
  if(S.view==='gen') S.view=S.profile?'profil':'questionnaire';
  applyTournage(); render(true); })();
</script>
